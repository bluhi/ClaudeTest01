<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>M3U8 링크 찾기</title>
<style>
  body {
    width: 380px;
    max-height: 480px;
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    color: #222;
  }
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    background: #fafafa;
  }
  #count {
    color: #555;
  }
  button {
    cursor: pointer;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
  }
  button:hover {
    background: #f0f0f0;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 420px;
    overflow-y: auto;
  }
  li {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    word-break: break-all;
  }
  li:hover {
    background: #f5f8ff;
  }
  li.copied {
    background: #e6ffed;
  }
  .line-text {
    font-family: Consolas, Menlo, monospace;
    font-size: 12px;
    line-height: 1.4;
  }
  .extra {
    margin-top: 4px;
    color: #888;
    font-size: 11px;
  }
  #empty {
    padding: 16px 10px;
    color: #888;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="header">
    <span id="count">스캔 중...</span>
    <button id="rescan">다시 스캔</button>
  </div>
  <ul id="results"></ul>
  <script src="popup.js"></script>
</body>
</html>
